name: Keep-alive

# Supabase pauses free projects after 7 days of inactivity, which would leave
# the public demo dead. Ping every 5 days to stay comfortably inside that window.
on:
  schedule:
    - cron: '0 9 */5 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL repository variable is not set — skipping."
            exit 0
          fi
          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' "$APP_URL/api/health")
          cat /tmp/health.json
          echo
          if [ "$code" != "200" ]; then
            echo "Health check failed with HTTP $code"
            exit 1
          fi
